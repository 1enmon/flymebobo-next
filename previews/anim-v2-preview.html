<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全屏动画 v2 · 中间有图 + 上下渐变</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#eef0f4; color:#1c2434; display:flex; flex-direction:column; align-items:center; padding:14px 10px 30px; }
  .banner { background:#fff7e0; border:1px dashed #c9a227; border-radius:10px; color:#7a6414; font-size:12.5px; line-height:1.6; padding:8px 12px; margin-bottom:14px; text-align:center; width:100%; max-width:380px; }
  h3 { width:100%; max-width:380px; font-size:15px; margin:16px 0 8px; }
  h3 span { color:#7a8699; font-weight:400; font-size:12.5px; }
  .stage { position:relative; width:100%; max-width:380px; height:480px; border-radius:26px; overflow:hidden; box-shadow:0 10px 30px rgba(30,40,60,.22); background:linear-gradient(165deg,#7fae7a 0%,#4a7a5c 40%,#2c4a3e 100%); }
  .stage .clock { position:absolute; top:56px; left:0; right:0; text-align:center; color:rgba(255,255,255,.9); font-size:52px; font-weight:200; }
  .stage .icons { position:absolute; left:18px; right:18px; bottom:70px; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stage .icons i { display:block; height:52px; border-radius:14px; background:rgba(255,255,255,.28); }
  .playbtn { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); background:#1c2434; color:#fff; font-size:14px; font-weight:600; padding:10px 22px; border-radius:999px; cursor:pointer; z-index:40; white-space:nowrap; }
  .veil { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0; pointer-events:none;
          background:linear-gradient(to bottom, rgba(13,15,32,0) 0%, rgba(13,15,32,.55) 22%, rgba(13,15,32,.92) 50%, rgba(13,15,32,.55) 78%, rgba(13,15,32,0) 100%); }
  .stage.play .veil { animation:veilIn 2.8s ease forwards; }
  @keyframes veilIn { 0%{opacity:0} 10%{opacity:1} 84%{opacity:1} 100%{opacity:0} }
  .halo { position:absolute; width:150px; height:150px; border-radius:50%; border:2px solid rgba(255,255,255,0); }
  .stage.play .halo { animation:halo 2.8s ease forwards; }
  @keyframes halo { 0%,18%{transform:scale(.6); border-color:rgba(255,255,255,0)} 32%{border-color:rgba(255,255,255,.55)} 64%,100%{transform:scale(1.9); border-color:rgba(255,255,255,0)} }
  .art { position:relative; width:148px; height:148px; border-radius:50%; overflow:hidden; box-shadow:0 16px 48px rgba(0,0,0,.5), 0 0 0 3px rgba(255,255,255,.22); opacity:0; transform:scale(.4); }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .stage.play .art { animation:artIn 2.8s cubic-bezier(.22,1.36,.4,1) forwards; }
  @keyframes artIn { 0%{opacity:0; transform:scale(.4) translateY(14px)} 16%{opacity:1; transform:scale(1.05) translateY(0)} 22%{transform:scale(1)} 84%{opacity:1; transform:scale(1)} 100%{opacity:0; transform:scale(.97)} }
  .big { margin-top:26px; color:#fff; font-size:21px; font-weight:700; letter-spacing:2px; opacity:0; text-shadow:0 2px 12px rgba(0,0,0,.45); }
  .small { margin-top:9px; color:rgba(255,255,255,.85); font-size:13px; opacity:0; text-shadow:0 1px 8px rgba(0,0,0,.45); }
  .stage.play .big { animation:txtIn 2.8s ease forwards; animation-delay:.12s; }
  .stage.play .small { animation:txtIn 2.8s ease forwards; animation-delay:.22s; }
  @keyframes txtIn { 0%,14%{opacity:0; transform:translateY(8px)} 26%{opacity:1; transform:translateY(0)} 84%{opacity:1} 100%{opacity:0} }
  .note { max-width:380px; margin-top:12px; font-size:13px; line-height:1.75; color:#4a5568; background:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 2px 8px rgba(30,40,60,.06); }
  .note b { color:#1c2434; }
</style>
